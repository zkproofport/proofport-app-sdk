# ZKProofport SDK - Publish to npm
# Triggered automatically when Release Please creates a GitHub Release

name: Publish to npm

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Upgrade npm for OIDC trusted publishing
        # npm@11 (latest 11.x) supports OIDC trusted publishing (>=11.5.1) and
        # is compatible with node 20. npm@latest is now 12.x which requires
        # node >=22.22 and fails EBADENGINE on the node 20 runner.
        run: npm install -g npm@11

      - name: Publish to npm (OIDC trusted publisher)
        run: |
          if [[ "${{ github.event.release.tag_name }}" == *"beta"* ]]; then
            npm publish --access public --tag beta
          else
            npm publish --access public
          fi
