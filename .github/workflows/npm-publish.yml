# ZKProofport SDK - Publish to npm
# Triggered automatically when Release Please creates a GitHub Release

name: Publish to npm

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      # The SDK type-checks against core's built declarations.
      - name: Build core
        run: npm run build --workspace packages/core

      - name: Type check
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Upgrade npm for OIDC trusted publishing
        # npm@11 (latest 11.x) supports OIDC trusted publishing (>=11.5.1) and
        # is compatible with node 20. npm@latest is now 12.x which requires
        # node >=22.22 and fails EBADENGINE on the node 20 runner.
        run: npm install -g npm@11

      # Two packages release from this repository: the SDK (tags vX.Y.Z) and
      # @zkproofport-app/core in packages/core (tags core-vX.Y.Z). The tag says
      # which one this release is. Each needs its own trusted-publisher entry
      # on npmjs.com; core's first version had to be published by hand, because
      # npm cannot attach a trusted publisher to a package that does not exist.
      - name: Publish to npm (OIDC trusted publisher)
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          case "$TAG" in
            core-v*) dir=packages/core ;;
            v*)      dir=. ;;
            *) echo "Unknown release tag '$TAG': expected vX.Y.Z or core-vX.Y.Z" >&2; exit 1 ;;
          esac
          dist=latest
          [[ "$TAG" == *beta* ]] && dist=beta
          name=$(node -p "require('./$dir/package.json').name")
          version=$(node -p "require('./$dir/package.json').version")
          # core's first version is published by hand (see above); its release
          # must not fail for trying to publish the same version again.
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already on npm; nothing to publish."
            exit 0
          fi
          (cd "$dir" && npm publish --access public --tag "$dist")
